[default]
pass_k = []
avg_k = [16]
report_pass_k = []
report_avg_k = [16]

[cot]
template = "free_response_cot_default"
alpha_frequency = 0.25
alpha_decay = 0.99
cot_prompt_template = "User: Solve the problem using one clean solution path. Keep each step concise. Preserve the requested answer form. Do not restart, repeat, enumerate alternative methods, or re-check solved cases. If the reasoning starts to loop, stop and give the best final answer. (think)\n<Q>\nAssistant: <think>"

[final]
template = "free_response_final_default"
final_prompt_template = "<Q><COT>\n</think>\nTherefore, the final answer is \\(\\boxed{"
