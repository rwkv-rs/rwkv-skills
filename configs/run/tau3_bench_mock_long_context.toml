[run]
run_mode = "rerun"
max_samples = 2
batch_size = 4

[dataset]
name = "tau3_bench_mock_long_context"
split = "base"

[model]
infer_base_url = "http://127.0.0.1:19081"
infer_model = "rwkv7-g1f-7.2b-20260414-ctx8192"
infer_timeout_s = 600
infer_max_workers = 4

[runner]
benchmark_kind = "tau3_bench"
prompt_style = "rwkv_official_json"
tool_catalog_format = "json"
avg_ks = [1]
history_max_chars = 24000
prompt_max_chars = 8192
long_doc_max_chars = 900
long_doc_overlap_lines = 2
long_doc_min_chars = 1200
long_doc_max_evidence_chunks = 3
long_doc_max_evidence_chars = 3000
max_steps = 12
max_tool_errors = 3
decision_max_tokens = 256
