[run]
id = "tau3_airline_g1g_baseline_newapi_20260528"
job = "function_tau3_bench"
run_mode = "rerun"
max_samples = 50
batch_size = 4

[dataset]
name = "tau3_bench_airline"
split = "base"

[model]
infer_base_url = "http://127.0.0.1:19081"
infer_model = "rwkv7-g1g-7.2b-20260523-ctx8192"
infer_timeout_s = 900
infer_max_workers = 8

[runner]
benchmark_kind = "tau3_bench"
prompt_style = "rwkv_official_json"
tool_catalog_format = "json"
avg_ks = [1]
history_max_chars = 16000
prompt_max_chars = 8192
long_doc_mode = "off"
tool_router_mode = "off"
max_steps = 80
max_tool_errors = 10
decision_max_tokens = 512
