[run]
run_mode = "rerun"
max_samples = 50
batch_size = 64

[dataset]
name = "tau3_bench_airline"
split = "base"

[model]
infer_base_url = "http://127.0.0.1:18081"
infer_model = "rwkv7-g1e-13.3b-20260309-ctx8192"
infer_timeout_s = 600
infer_max_workers = 64

[runner]
benchmark_kind = "tau3_bench"
prompt_style = "rwkv_flower_json"
tool_catalog_format = "json"
avg_ks = [1]
history_max_chars = 16000
max_steps = 200
max_tool_errors = 10
decision_max_tokens = 1024
