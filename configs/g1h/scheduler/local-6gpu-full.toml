profile = "local-6gpu-full"
run_tag = "local_6gpu_full"

[paths]
log_dir = "logs/scheduler/{run_tag}"
pid_dir = "logs/scheduler/{run_tag}/pids"
run_log_dir = "results/logs/{run_tag}"

[inference]
base_url = "http://127.0.0.1:19083/v1"
protocol = "vllm"
seed_policy = "preserve"
timeout_s = 900
max_workers = 32
worker_profile = "fixed"
remote_batch_size = 32
slots_per_model = 1
backpressure = true
backpressure_timeout_s = 2.0
backpressure_pending_high_watermark = 0
budget_min_workers = 1

[[inference.model_groups]]
slot_prefix = "g1f15"
model = "rwkv7-g1f-1.5b-20260419-ctx8192"
slots = 8
start = 1
width = 2

[[inference.model_groups]]
slot_prefix = "g1g15"
model = "rwkv7-g1g-1.5b-20260526-ctx8192"
slots = 8
start = 1
width = 2

[[inference.model_groups]]
slot_prefix = "g1f29"
model = "rwkv7-g1f-2.9b-20260420-ctx8192"
slots = 8
start = 1
width = 2

[[inference.model_groups]]
slot_prefix = "g1g29"
model = "rwkv7-g1g-2.9b-20260526-ctx8192"
slots = 8
start = 1
width = 2

[[inference.model_groups]]
slot_prefix = "g1f72"
model = "rwkv7-g1f-7.2b-20260414-ctx8192"
slots = 1
start = 1
width = 2

[[inference.model_groups]]
slot_prefix = "g1g72"
model = "rwkv7-g1g-7.2b-20260523-ctx8192"
slots = 1
start = 1
width = 2

[selection]
model_select = "latest-data"
only_jobs = [
  "multi_choice_plain",
  "multi_choice_plain_naive",
  "multi_choice_cot",
  "multi_choice_cot_naive",
  "free_response",
  "free_response_naive",
  "free_response_judge",
  "free_response_judge_naive",
  "code_human_eval",
  "code_human_eval_naive",
  "code_mbpp",
  "code_mbpp_naive",
  "code_livecodebench",
  "code_livecodebench_naive",
  "code_swe_bench",
  "code_swe_bench_naive",
  "instruction_following",
  "instruction_following_naive",
  "function_agent_tool_call",
  "function_browsecomp",
  "function_browsecomp_plus",
  "function_complexfuncbench",
  "function_longbench",
  "function_longcodebench",
  "function_mcp_bench",
  "function_api_bank",
  "function_agentbench",
  "function_bfcl_v3",
  "function_bfcl_ast",
  "function_bfcl_exec",
  "function_toolalpaca",
  "function_tau_bench",
  "function_tau2_bench",
  "function_tau3_bench",
]
job_order = [
  "code_human_eval_naive",
  "code_mbpp_naive",
  "code_livecodebench_naive",
  "code_swe_bench_naive",
  "multi_choice_plain_naive",
  "multi_choice_cot_naive",
  "multi_choice_plain",
  "multi_choice_cot",
  "free_response_naive",
  "free_response_judge_naive",
  "free_response",
  "free_response_judge",
  "instruction_following_naive",
  "code_swe_bench",
  "instruction_following",
  "function_agent_tool_call",
  "function_agentbench",
  "function_api_bank",
  "function_bfcl_ast",
  "function_bfcl_exec",
  "function_bfcl_v3",
  "function_browsecomp",
  "function_browsecomp_plus",
  "function_complexfuncbench",
  "function_longbench",
  "function_longcodebench",
  "function_mcp_bench",
  "function_tau_bench",
  "function_tau2_bench",
  "function_tau3_bench",
  "function_toolalpaca",
]
only_datasets = []
skip_datasets = []
enable_param_search = false

[runtime]
run_mode = "auto"
dispatch_poll_seconds = 20
gpu_idle_max_mem = 1000
skip_missing_dataset = true
clean_param_swap = false
disable_checker = true
distributed_claims = false
lease_duration_s = 900

[coding]
eval_workers = 1
max_active_runners = 1

[function_calling]
candidate_router_mode = "auto"
